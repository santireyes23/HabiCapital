name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: habicapital
          POSTGRES_PASSWORD: habicapital
          POSTGRES_DB: habicapital_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U habicapital -d habicapital_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      # En CI no hay base de desarrollo: las migraciones y las pruebas usan la de pruebas.
      HABICAPITAL_DATABASE_URL: postgresql+psycopg://habicapital:habicapital@localhost:5432/habicapital_test
      HABICAPITAL_TEST_DATABASE_URL: postgresql+psycopg://habicapital:habicapital@localhost:5432/habicapital_test
      HABICAPITAL_REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Ruff (formato)
        run: uv run ruff format --check .

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy src tests migrations

      - name: Migraciones (upgrade head)
        run: uv run alembic upgrade head

      - name: Pruebas
        run: uv run pytest
